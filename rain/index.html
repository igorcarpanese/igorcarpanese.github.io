<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Full-screen rain ambience. Click or tap to listen.">
  <title>Rain</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <button id="start" type="button">
    <span>click or tap to start</span>
  </button>
  <button id="mute" type="button" hidden aria-pressed="false" aria-label="Mute">
    <svg class="icon-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M4 10h3.2L11 6.5v11L7.2 14H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M14.5 9.2a3.8 3.8 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M16.6 7a6.6 6.6 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <svg class="icon-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M4 10h3.2L11 6.5v11L7.2 14H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M16 10l4 4M20 10l-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>
  <script src="./app.js" defer></script>
</body>
</html>
